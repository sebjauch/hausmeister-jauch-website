name: Bilder sichern

# Holt die Bilder einmalig von Base44 und legt sie ins Repository.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/base44-images.txt
      - .github/workflows/save-images.yml

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilder herunterladen
        run: ./scripts/download-images.sh
      - name: Bilder einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "Keine neuen Bilder."
          else
            git commit -m "Bilder von Base44 sichern"
            git push
          fi
